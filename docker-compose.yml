services:
  migrate:
    build: ./backend
    command: uv run --no-dev alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/adequia

  api:
    build: ./backend
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/adequia
      - REDIS_URL=redis://redis:6379
      # backend/.env's OLLAMA_BASE_URL is meant for `uv run` on the host,
      # where localhost is the host itself — inside this container it
      # would mean the container, not the host running Ollama.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

  worker:
    build: ./backend
    command: uv run --no-dev python -m app.worker.rq_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/adequia
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=adequia
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [api]
    env_file: ./frontend/.env

volumes:
  pgdata:
