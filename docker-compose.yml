services:
  migrate:
    build: ./backend
    command: uv run --no-dev alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/adequia

  checkpointer-setup:
    build: ./backend
    command: uv run --no-dev python -m app.mcp.setup_checkpointer
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/adequia

  mcp:
    build: ./backend
    command: uv run --no-dev python -m app.mcp.server
    expose: ["8100"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/adequia
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "python", "-c", "import socket; socket.create_connection(('localhost', 8100), timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      checkpointer-setup:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/adequia
      - REDIS_URL=redis://redis:6379
      # backend/.env's OLLAMA_BASE_URL is meant for `uv run` on the host,
      # where localhost is the host itself — inside this container it
      # would mean the container, not the host running Ollama.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - MCP_SERVER_URL=http://mcp:8100

  worker:
    build: ./backend
    command: uv run --no-dev python -m app.worker.rq_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      checkpointer-setup:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/adequia
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - MCP_SERVER_URL=http://mcp:8100

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=adequia
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [api]
    env_file: ./frontend/.env

volumes:
  pgdata:
