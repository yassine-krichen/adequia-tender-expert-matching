[project]
name = "adequia-backend"
version = "0.1.0"
description = "AdéquIA — CV/TDR matching, scoring, and anomaly detection API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.13",
    "redis>=5.2",
    "rq>=2.0",
    "python-multipart>=0.0.12",
    "langchain-groq>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=0.2",
    "langchain-text-splitters>=0.3",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "langgraph-checkpoint-postgres>=2.0",
    # langgraph-checkpoint-postgres pulls plain `psycopg`, which has no
    # working pq wrapper without libpq installed on the host (confirmed:
    # ImportError on Windows dev machines with no local libpq). The
    # `[binary]` extra ships a prebuilt libpq, needed for `uv run` outside
    # Docker; the Linux container image works either way.
    "psycopg[binary]>=3.2",
    "mcp>=1.2",
    "langchain-mcp-adapters>=0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "reportlab>=4.2",
    "aiosqlite>=0.22.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: hits real LLM providers against real documents in docs/tdrs -- costs quota/time, run explicitly via `pytest -m eval`",
]
addopts = "-m 'not eval'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
