name: Eval Suite

on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --all-extras
      # Runs the RAGAS/DeepEval suite against the gold datasets from
      # docs/04-evaluation-metrics.md. Spends real LLM API tokens — manual
      # trigger only, run before milestones/demos or after prompt/weight changes.
      - run: uv run pytest tests/eval
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
