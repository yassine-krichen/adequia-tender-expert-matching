x-backend-env: &backend-env
  GROQ_API_KEYS: ${GROQ_API_KEYS}
  GEMINI_API_KEYS: ${GEMINI_API_KEYS}
  GROQ_EXTRACTION_MODEL: ${GROQ_EXTRACTION_MODEL}
  GROQ_REASONING_MODEL: ${GROQ_REASONING_MODEL}
  GEMINI_EXTRACTION_MODEL: ${GEMINI_EXTRACTION_MODEL}
  GEMINI_REASONING_MODEL: ${GEMINI_REASONING_MODEL}
  OLLAMA_EXTRACTION_MODEL: ${OLLAMA_EXTRACTION_MODEL}
  OLLAMA_REASONING_MODEL: ${OLLAMA_REASONING_MODEL}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING}
  LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
  ENVIRONMENT: ${ENVIRONMENT}
  LOG_LEVEL: ${LOG_LEVEL}

services:
  migrate:
    build: ./backend
    command: uv run --no-dev alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/adequia

  checkpointer-setup:
    build: ./backend
    command: uv run --no-dev python -m app.mcp.setup_checkpointer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/adequia

  mcp:
    build: ./backend
    command: uv run --no-dev python -m app.mcp.server
    expose: ["8100"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/adequia
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "python", "-c", "import socket; socket.create_connection(('localhost', 8100), timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      checkpointer-setup:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/adequia
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MCP_SERVER_URL: http://mcp:8100
    extra_hosts:
      - host.docker.internal:host-gateway

  worker:
    build: ./backend
    command: uv run --no-dev python -m app.worker.rq_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      checkpointer-setup:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/adequia
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MCP_SERVER_URL: http://mcp:8100
    extra_hosts:
      - host.docker.internal:host-gateway

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=adequia
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
